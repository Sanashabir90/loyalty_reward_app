<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-sm rounded-3xl shadow-2xl p-8 border border-white/10 text-center">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Sana Channar</h2>
            <p class="text-gray-500 text-sm">Loyalty Program Member</p>
        </div>

        <div class="bg-indigo-600 rounded-3xl p-8 mb-8 text-white shadow-xl shadow-indigo-500/20">
            <p class="text-xs uppercase tracking-widest font-semibold opacity-80">Total Points</p>
            <h1 class="text-6xl font-extrabold mt-2" id="pointsDisplay">150</h1>
            <p class="mt-4 inline-block px-4 py-1 bg-indigo-500 rounded-full text-xs font-bold">GOLD TIER</p>
        </div>

        <button id="checkInBtn" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-gray-800 active:scale-95 transition-all duration-300 shadow-lg">
            Check-in & Earn Points
        </button>
        
        <p class="text-[10px] text-gray-400 mt-6">Secure Loyalty System v1.0</p>
    </div>

    <script>
        // Local Storage se points load karein
        let points = localStorage.getItem('userPoints') ? parseInt(localStorage.getItem('userPoints')) : 150;
        document.getElementById('pointsDisplay').innerText = points;

        // Button click par points update karein
        document.getElementById('checkInBtn').addEventListener('click', () => {
            points += 10;
            localStorage.setItem('userPoints', points);
            document.getElementById('pointsDisplay').innerText = points;
            alert("Check-in successful! 10 points added.");
        });
    </script>
</body>
</html>
